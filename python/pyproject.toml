[project]
name = "honest-workspace"
version = "0"
description = "uv workspace root for the Honest Framework Python reference implementation."
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
# Members are listed explicitly, not globbed. A "honest-*" glob pulls in every
# folder under python/, and uv refuses to resolve the workspace if any member
# lacks a pyproject.toml. Our method writes a module's .hd before its code, so a
# new module spends time as a declaration-only folder with no pyproject.toml; a
# glob would make each one break every `uv run` in the workspace until the code
# stage. A module joins this list when it gets its pyproject.toml, which is its
# code stage. Until then its declaration-only folder stays invisible to uv.
members = [
  "honest-alerts",
  "honest-auth",
  "honest-check",
  "honest-check_cli",
  "honest-design",
  "honest-errors",
  "honest-estimate",
  "honest-features",
  "honest-gherkin",
  "honest-observe",
  "honest-page",
  "honest-parse",
  "honest-persist",
  "honest-rca",
  "honest-state",
  "honest-test",
  "honest-type",
  "honest-utilities",
  "tree-sitter-honest-jinja",
  "tree-sitter-honest-hd",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# The dogfooding gate (coverage-all.sh). precision=2 makes --fail-under=100 exact: a single
# unhit line out of thousands reads as 99.9x < 100 and blocks, rather than rounding up to a
# false pass. No exclude_lines: the gate covers even the CLI __main__ shim by running it as a
# module, so every source line is genuinely exercised.
[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true

# The Pydantic and Django schema loaders (section 2) are optional, Python-specific adapters — not part
# of the pure core. They live in the dev group so the loaders' conformance runs under the gate; an
# adopter opts in via the honest-persist[pydantic] or [django] extra. The pure core never imports them.
#
# FastAPI and Jinja2 are the honest-page reference server's stack: honest-page declares them as its own
# dependencies and ships the templates and token stylesheet inside the package (create_app is the
# composition root). They stay in the dev group too so the reference runs under the gate here even
# outside honest-page's own closure. The pure modules never import them.
[dependency-groups]
dev = ["pydantic>=2", "django>=4", "psycopg[binary]>=3", "pyturso>=0.1", "fastapi>=0.110", "jinja2>=3"]
