[project]
name = "honest-check_cli"
version = "0.1.0"
description = "Command-line declaration checker — crosses an .hd declaration against the code it describes."
requires-python = ">=3.11"
dependencies = ["honest-parse", "honest-design"]

[tool.uv.sources]
honest-parse = { workspace = true }
honest-design = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honest_check_cli"]
