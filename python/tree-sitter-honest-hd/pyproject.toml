[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-honest-hd"
version = "0.1.0"
description = "Honest Framework .hd architecture-declaration grammar for tree-sitter — the parse boundary honest-design's reader folds into the IR."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# uv rebuilds this package's compiled binding only when a file it is told to watch changes. By
# default that is the packaging metadata alone, so a regenerated src/parser.c left the old binding
# in place and the old grammar kept parsing, with every gate green (2026-09-02). These are the
# files the binding is built from.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "src/parser.c" },
  { file = "src/grammar.json" },
  { file = "bindings/python/**/*.c" },
]

# The tree-sitter CLI that generated src/parser.c. Two CLI versions generate two different parser
# files from one grammar: 0.26.12 reproduces the committed parser byte for byte and 0.25.10 does
# not, measured on 2026-09-20. Without this, grammar-gate.sh picks the highest version the machine
# happens to have, so the same grammar regenerates differently on two machines and the gate reports
# a drift that is only a version difference. The gate reads this value and refuses any other.
[tool.honest.grammar]
tree_sitter_cli = "0.26.12"
abi = 14
