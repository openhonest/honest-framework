[project]
name = "honest-auth"
version = "0.1.0"
description = "The authentication interface: the AuthProvider contract, a value registry, and the boundary dispatch. Identity is validated at the boundary and passed inward as data."
requires-python = ">=3.11"
dependencies = ["honest-type"]

[tool.uv.sources]
honest-type = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honest_auth"]

[tool.honest-check]
conformance = "python"
conformance-suite-version = "0"

# The reference provider honest-auth ships (dev_auth_provider). It declares its conformance level in
# package metadata per honest-auth-architecture.md §9.2. Full, not Complete: its resolve_actor is
# verifiably deterministic and mutates no domain (confirmed by the conformance probes
# resolve_actor_deterministic and the no-mutation law), but it is a code reference, not a black-box
# deployed endpoint (Complete's requirement).
[honest-auth-provider]
name = "dev-plaintext"
conformance = "Full"
conformance-suite-version = "1.0"
